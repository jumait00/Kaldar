{% extends "base.html" %}
{% block title %}Reset password · Expense Tracker{% endblock %}
{% block auth_content %}
<div class="auth-card">
<div class="brand auth-brand"><span class="brand-mark">₿</span><span>Expense<span>Tracker</span></span></div>
<h1>Reset password</h1>
<p class="muted">Enter your account email. Password reset requires email delivery to be configured on the server.</p>
<form method="post" class="form-stack">{% csrf_token %}<label>Email {{ form.email }}</label><button class="primary-btn">Send reset link</button></form>
</div>
{% endblock %}
