{% extends "base.html" %}
{% block title %}Choose password · Expense Tracker{% endblock %}
{% block auth_content %}<div class="auth-card"><h1>Choose a new password</h1><form method="post" class="form-stack">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<label>{{ field.label }}{{ field }}{% for e in field.errors %}<small class="field-error">{{ e }}</small>{% endfor %}</label>{% endfor %}<button class="primary-btn">Change password</button></form></div>{% endblock %}
